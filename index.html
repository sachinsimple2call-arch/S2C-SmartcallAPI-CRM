<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple2Call CTI & CRM Console</title>
    <!-- Include Supabase JS Client CDN for Real-Time Syncing -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #0056b3;
            --primary-hover: #004085;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --border: #ced4da;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--primary);
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 8px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #495057;
        }

        input[type="text"], input[type="password"], input[type="number"], select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 0.9rem;
        }

        button:hover { background-color: var(--primary-hover); }
        button.btn-danger { background-color: var(--danger); }
        button.btn-danger:hover { background-color: #bd2130; }
        button.btn-warning { background-color: var(--warning); color: #212529; }
        button.btn-warning:hover { background-color: #e0a800; }
        button.btn-success { background-color: var(--success); }
        button.btn-success:hover { background-color: #218838; }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        pre {
            background: #1e1e1e;
            color: #00ff66;
            padding: 15px;
            border-radius: 6px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.85rem;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .pill {
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Global API Configuration -->
    <div class="card full-width">
        <h2>Global API & Account Configuration</h2>
        <div class="grid-3">
            <div class="form-group">
                <label>API Endpoint URL</label>
                <input type="text" id="api_url" value="https://conference.simple2call.in/ab_api.php">
            </div>
            <div class="form-group">
                <label>Username (un)</label>
                <input type="text" id="un" value="sachin_admin">
            </div>
            <div class="form-group">
                <label>Password (pw)</label>
                <input type="password" id="pw" value="Ashu@7979">
            </div>
            <div class="form-group">
                <label>Server (svr)</label>
                <input type="text" id="svr" value="conference.simple2call.in">
            </div>
            <div class="form-group">
                <label>Sub-Tag (sb_tag)</label>
                <input type="text" id="sb_tag" value="TestTag">
            </div>
            <div class="form-group">
                <label>Routed Name</label>
                <input type="text" id="routed_name" value="NeerajDemo">
            </div>
        </div>
    </div>

    <!-- Call Initiation -->
    <div class="card">
        <h2>1. Initiate Call Requests</h2>
        
        <div class="form-group">
            <label>CLI (Agent / Source Number)</label>
            <input type="text" id="cli" value="918452080008">
        </div>

        <div class="form-group">
            <label>Customer Number / Digits (digits_1)</label>
            <input type="text" id="digits_1" value="917756009344">
        </div>

        <div class="form-group">
            <label>Customer Name (name_1)</label>
            <input type="text" id="name_1" value="Mittal Patel">
        </div>

        <div class="form-group">
            <label>Hold Duration (Seconds)</label>
            <input type="number" id="hold_duration" value="120">
        </div>

        <div class="action-group">
            <button onclick="sendAgentCallCustomer()" class="btn-success">Agent Call Customer (agent_call_customer)</button>
            <button onclick="sendDialOut()">Dial Out / Call Me (dial_out)</button>
        </div>
    </div>

    <!-- In-Call Control Panel -->
    <div class="card">
        <h2>2. Active Call Control Panel</h2>
        
        <div class="form-group" style="background: #fff3cd; padding: 12px; border-radius: 4px; border: 1px solid #ffeeba;">
            <label style="color: #856404; font-weight: bold;">Active Call Control SID (e.g. G1IZSzwN)</label>
            <input type="text" id="active_sid" placeholder="Waiting for live webhook SID..." style="font-weight: bold; color: #856404; background: #fff;">
            <small id="call_status_label" style="color: #856404; display: block; margin-top: 5px;">Status: IDLE | System Tran ID: -</small>
        </div>

        <!-- Hold Controls -->
        <label>Hold Controls</label>
        <div class="grid-2" style="margin-bottom: 15px;">
            <button class="btn-warning" onclick="sendControl('HoldOn')">Hold On</button>
            <button class="btn-success" onclick="sendControl('HoldOff')">Hold Off</button>
        </div>

        <!-- 3rd Party Controls -->
        <label>3rd Party / Transfer Settings</label>
        <div class="grid-2" style="margin-bottom: 8px;">
            <input type="text" id="third_party_cli" placeholder="3rd Party CLI" value="13216930000">
            <input type="text" id="third_party_digits" placeholder="3rd Party Digits" value="19084444455">
        </div>
        
        <div class="grid-2" style="margin-bottom: 15px;">
            <button onclick="sendDial3rdParty()">Dial 3rd Party</button>
            <button class="btn-success" onclick="sendControl('3Way')">Bridge 3-Way</button>
            <button class="btn-warning" onclick="sendControl('Disconnect3rdParty')">Drop 3rd Party</button>
            <button onclick="sendControl('Transfer')">Transfer & Exit</button>
        </div>

        <!-- Status & Terminate -->
        <label>Status & Call Release</label>
        <div class="grid-3">
            <button onclick="sendControl('Status')">Get Status</button>
            <button onclick="sendRefreshControl()">Refresh Logs</button>
            <button class="btn-danger" onclick="sendControl('Hangup')">Hangup Call</button>
        </div>
    </div>

    <!-- Output & Logs -->
    <div class="card full-width">
        <h2>
            Response Console Log 
            <span id="last_action" class="pill">Idle</span>
            <button onclick="clearLogs()" style="width: auto; float: right; padding: 2px 10px; font-size: 0.75rem;">Clear Console</button>
        </h2>
        <pre id="response_log">// Webhook events, live SIDs, and API responses will appear here in real-time...</pre>
    </div>

</div>

<script>
    // Initialize Supabase Client for Real-Time UI Syncing
    const supabaseUrl = 'https://vwvsfuvdatdtjlrredvu.supabase.co';
    const supabaseKey = 'sb_publishable_L7--J6HSa9X8FLb7SVc5gQ_AYy9zngU';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    // Real-Time Listener: Automatically populates the input box with the live SID (e.g. G1IZSzwN)
    supabaseClient
        .channel('public:active_calls')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'active_calls' }, payload => {
            if (payload.new && payload.new.sid) {
                // EXCLUSIVELY assign the live SID to the control box
                document.getElementById('active_sid').value = payload.new.sid;
                document.getElementById('call_status_label').innerText = 
                    `Status: ${payload.new.status} | System Tran ID: ${payload.new.tran_id}`;
                logResponse("Live Webhook SID Synced", payload.new);
            }
        })
        .subscribe();

    function generateTranId() {
        return 'NP' + Math.random().toString(36).substring(2, 8) + Date.now().toString().slice(-4);
    }

    function logResponse(action, data) {
        const logElement = document.getElementById('response_log');
        document.getElementById('last_action').innerText = action;
        const timestamp = new Date().toLocaleTimeString();
        logElement.innerText = `[${timestamp}] --- Action: ${action} ---\n` + JSON.stringify(data, null, 2) + "\n\n" + logElement.innerText;
    }

    function clearLogs() {
        document.getElementById('response_log').innerText = '// Console cleared.';
        document.getElementById('last_action').innerText = 'Idle';
    }

    async function makeApiRequest(payload, actionName) {
        const url = document.getElementById('api_url').value;
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            logResponse(actionName, data);
            return data;
        } catch (error) {
            logResponse(actionName + " (Error)", { error: error.message });
        }
    }

    async function sendAgentCallCustomer() {
        const tranId = generateTranId();
        document.getElementById('call_status_label').innerText = `Status: INITIATING | System Tran ID: ${tranId}`;

        const payload = {
            msg_type: "agent_call_customer",
            tran_id: tranId, // Used ONLY for initiating the call request
            un: document.getElementById('un').value,
            pw: document.getElementById('pw').value,
            svr: document.getElementById('svr').value,
            sb_tag: document.getElementById('sb_tag').value,
            routed_name: document.getElementById('routed_name').value,
            cli: document.getElementById('cli').value,
            hold_duration: parseInt(document.getElementById('hold_duration').value),
            dest_count: 1,
            digits_1: document.getElementById('digits_1').value,
            name_1: document.getElementById('name_1').value
        };
        await makeApiRequest(payload, "agent_call_customer");
    }

    async function sendDialOut() {
        const tranId = generateTranId();
        document.getElementById('call_status_label').innerText = `Status: INITIATING | System Tran ID: ${tranId}`;

        const payload = {
            msg_type: "dial_out",
            tran_id: tranId, // Used ONLY for initiating the call request
            un: document.getElementById('un').value,
            pw: document.getElementById('pw').value,
            svr: document.getElementById('svr').value,
            sb_tag: document.getElementById('sb_tag').value,
            routed_name: document.getElementById('routed_name').value,
            agent_number: document.getElementById('cli').value,
            customer_number: document.getElementById('digits_1').value
        };
        await makeApiRequest(payload, "dial_out");
    }

    async function sendControl(commandName) {
        const activeSid = document.getElementById('active_sid').value.trim();
        if (!activeSid) {
            alert("No active Call SID found! Waiting for webhook event or please paste the live SID.");
            return;
        }

        const payload = {
            msg_type: "control",
            tran_id: activeSid, // EXCLUSIVELY uses the live SID (e.g. G1IZSzwN) for call controls
            un: document.getElementById('un').value,
            pw: document.getElementById('pw').value,
            svr: document.getElementById('svr').value,
            command: commandName
        };
        await makeApiRequest(payload, `control [${commandName}]`);
    }

    async function sendDial3rdParty() {
        const activeSid = document.getElementById('active_sid').value.trim();
        if (!activeSid) {
            alert("No active Call SID found!");
            return;
        }

        const payload = {
            msg_type: "control",
            tran_id: activeSid, // Uses live SID
            un: document.getElementById('un').value,
            pw: document.getElementById('pw').value,
            svr: document.getElementById('svr').value,
            command: "Dial3rdParty",
            cli: document.getElementById('third_party_cli').value,
            digits: document.getElementById('third_party_digits').value
        };
        await makeApiRequest(payload, "control [Dial3rdParty]");
    }

    async function sendRefreshControl() {
        const activeSid = document.getElementById('active_sid').value.trim();
        if (!activeSid) {
            alert("No active Call SID found!");
            return;
        }

        const payload = {
            msg_type: "control",
            tran_id: activeSid, // Uses live SID
            un: document.getElementById('un').value,
            pw: document.getElementById('pw').value,
            svr: document.getElementById('svr').value,
            command: "Refresh",
            bump: 0
        };
        await makeApiRequest(payload, "control [Refresh]");
    }
</script>

</body>
</html>
